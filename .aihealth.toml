# aihealth (github.com/epatel/ai-health) config for production code, profile "strict"
# (confirmed by the owner). Target is 10 (no finding), 9.5 at least. Tests have their own
# config, tests/.aihealth.toml: the same profile without Primitive Obsession (owner decision
# Q18.1). KEEP BOTH FILES IN SYNC. They merge into one once aihealth supports per-path
# overrides (epatel/ai-health#4). Every call passes `--config` explicitly, because aihealth
# would otherwise look for the file in the scanned folder and silently fall back to its
# defaults. All keys: src/aihealth/config.py of the pinned release.

[thresholds]
large_file = 600              # code lines (default 1000)
primitive_obsession = 0.3     # share of typed parameters that are primitive (default 0.6)

[score]
decay = 8                     # stricter than the default 15
symbol_cap = 4
density_loc = 100000          # large files get no relief from a low smell density

[delta]
tolerance = 0.0               # any degradation fails `aihealth delta`

[scan]
exclude = [
    "src/narratty/_version.py",  # generated by hatch-vcs
    "site/*",                    # mkdocs build output
    ".nox/*",
    ".claude/skills/*",          # third-party agent skills (skills-lock.json), not our code
    # Scored with tests/.aihealth.toml. aihealth also matches excludes against every path
    # suffix, so this leaves out any directory named `tests`; besides tests/ that is only the
    # 5-line demo examples/editor-layout/project/tests/ (example content, not scored).
    "tests/*",
]
