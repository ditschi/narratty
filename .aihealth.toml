# aihealth (github.com/epatel/ai-health) config, profile "strict" (confirmed by the owner).
# Target is 10 (no finding); 9.5 is only the floor on the way there. Change the profile
# here and nowhere else; every call passes `--config .aihealth.toml` explicitly, because
# aihealth would otherwise look for the file in the scanned folder and silently fall back
# to its defaults. All keys: src/aihealth/config.py of the pinned release.

[thresholds]
large_file = 600              # code lines (default 1000)
primitive_obsession = 0.3     # share of typed parameters that are primitive (default 0.6)

[score]
decay = 8                     # stricter than the default 15
symbol_cap = 4
density_loc = 100000          # large files get no relief from a low smell density

[delta]
tolerance = 0.0               # any degradation fails `aihealth delta`

[scan]
exclude = [
    "src/narratty/_version.py",  # generated by hatch-vcs
    "site/*",                    # mkdocs build output
    ".nox/*",
    ".claude/skills/*",          # third-party agent skills (skills-lock.json), not our code
]
