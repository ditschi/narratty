default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]
# Third-party agent skills are kept byte-identical to skills-lock.json.
exclude: ^\.claude/skills/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]  # mkdocs.yml uses custom tags
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--ignore-words=.codespellignore, --quiet-level=2]
        # The German "Steckbrief" section of the code health page reads as typos.
        exclude: ^docs/contributor-guide/code-health\.md$

  # Quality gates mirror the nox sessions and run in isolated uv envs, so
  # versions come from the pyproject extras rather than host tools.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --isolated --extra lint ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --isolated --extra lint ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --isolated --extra type-check mypy
        language: system
        pass_filenames: false
        args: [--package, narratty]
      - id: mypy-tools
        name: mypy (tools)
        entry: uv run --isolated --extra type-check mypy tools
        language: system
        pass_filenames: false
        files: ^tools/
      # Staged changes must not make code health worse (aihealth, profile in .aihealth.toml).
      - id: code-health
        name: code health (aihealth delta)
        entry: uv run --quiet --locked --isolated --only-group code-health aihealth delta --staged --config .aihealth.toml
        language: system
        types_or: [python, go, shell]
        pass_filenames: false
      # aihealth suppressions are file-wide; they must say why, after " -- " (without it
      # aihealth reads the text as part of the smell name and silently ignores the comment).
      - id: aihealth-disable-reason
        name: aihealth suppressions give a reason
        language: pygrep
        entry: 'aihealth:[ \t]*disable=(?![\w, \t]+-- .{10})'
        types_or: [python, go, shell]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen
        stages: [commit-msg]
