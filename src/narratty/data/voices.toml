# Curated voice catalog. `narratty voices` lists these; `narratty voices pull` downloads them.
# Voices installed by hand into the data directory work too, they are just not listed here.

[piper]
# Files live at <base_url>/<family>/<language>/<name>/<quality>/<id>.onnx(.json)
base_url = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0"
card_url = "https://huggingface.co/rhasspy/piper-voices/blob/v1.0.0"

[[piper.voices]]
id = "en_US-lessac-medium"
description = "US English, female, clear (default)"

[[piper.voices]]
id = "en_US-amy-medium"
description = "US English, female"

[[piper.voices]]
id = "en_US-ryan-high"
description = "US English, male, high quality"

[[piper.voices]]
id = "en_US-libritts_r-medium"
description = "US English, many speakers (speaker 0)"

[[piper.voices]]
id = "en_GB-alan-medium"
description = "British English, male"

[[piper.voices]]
id = "en_GB-jenny_dioco-medium"
description = "British English, female"

[[piper.voices]]
id = "de_DE-thorsten-medium"
description = "German, male"

[[piper.voices]]
