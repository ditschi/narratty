[[piper.voices]]
id = "es_ES-davefx-medium"
description = "Spanish, male"

[kokoro]
# The fp16 model: about half the size of the fp32 one, faster on CPU, same sound.
version = "v1.0-fp16"
license = "Apache-2.0"
card_url = "https://huggingface.co/hexgrad/Kokoro-82M"

[[kokoro.files]]
name = "kokoro-v1.0.fp16.onnx"
url = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.fp16.onnx"
sha256 = "c1610a859f3bdea01107e73e50100685af38fff88f5cd8e5c56df109ec880204"

[[kokoro.files]]
name = "voices-v1.0.bin"
url = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
sha256 = "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"

# All Kokoro voices share one model; the language follows the id's first letter.
[kokoro.languages]
a = "en-us"
b = "en-gb"
e = "es"
f = "fr-fr"
h = "hi"
i = "it"
j = "ja"
p = "pt-br"
z = "cmn"

