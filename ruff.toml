target-version = "py312"
line-length = 110
extend-exclude = ["src/narratty/_version.py"]

[lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, complexity
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90"]

[lint.flake8-bugbear]
# Typer declares CLI parameters through default values.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
