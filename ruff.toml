target-version = "py312"
line-length = 110
extend-exclude = ["src/narratty/_version.py"]

[lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify. Structure (complexity,
# size, nesting, arguments) is judged by aihealth alone (nox -s code-health).
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[lint.flake8-bugbear]
# Typer declares CLI parameters through default values.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[format]
quote-style = "double"
