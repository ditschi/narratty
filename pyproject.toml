[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "narratty"
dynamic = ["version"]
description = "Turn a YAML script into a narrated terminal video with local TTS, VHS rendering and automatic voiceover sync."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ditschi" }]
keywords = ["terminal", "screencast", "vhs", "tts", "text-to-speech", "video", "cli", "docs-as-code"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/ditschi/narratty"
Source = "https://github.com/ditschi/narratty"
Documentation = "https://ditschi.github.io/narratty/"

[project.scripts]
narratty = "narratty.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
]
lint = [
    "ruff>=0.6",
]
type-check = [
    "mypy>=1.10",
]
code-quality = [
    "fawltydeps>=0.16",
    "vulture>=2.11",
    "pylint>=3.2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25",
    "mike>=2.1",
]
dev = [
    "nox>=2024.4",
    "commitizen>=3.29",
    "pre-commit>=3.7",
    "narratty[test,lint,type-check,code-quality,docs]",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/narratty/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/narratty"]

[tool.vulture]
min_confidence = 80
paths = ["src/narratty"]
exclude = ["src/narratty/_version.py"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "scm"
changelog_file = "CHANGELOG.md"
changelog_incremental = true
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: CLI cold-start latency budget checks (help and shell completion)",
]
addopts = "-m 'not performance'"

[tool.coverage.run]
omit = ["src/narratty/_version.py"]
