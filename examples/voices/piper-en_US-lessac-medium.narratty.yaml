# yaml-language-server: $schema=https://raw.githubusercontent.com/ditschi/narratty/main/schema/v1.json
tts:
  provider: piper
  voice: en_US-lessac-medium
terminal: {width: 960, height: 540, font_size: 20}
scenes:
  - id: voice
    narration: This is Piper with the voice lessac. Clear, a little more synthetic, and fast.
    actions:
      - type_command: "grep -m1 -A2 tts: piper-en_US-lessac-medium.narratty.yaml"
      - enter
      - hold: auto
