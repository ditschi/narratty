# yaml-language-server: $schema=https://raw.githubusercontent.com/ditschi/narratty/main/schema/v1.json
# An editor-like layout: yazi as file explorer and preview on top, a shell below.
# tmux, yazi, micro and delta come from the narratty toolkit, which the narratty
# image contains.
version: 1
meta:
  title: Editor layout with tmux and yazi
timing:
  tail_ms: 0          # the last visible frame is held in the diff scene instead
terminal:
  width: 1600
  height: 900
  font_size: 18
  layout: editor
requires:
  tools: [tmux, yazi, micro, git]
workspace:
  source: project
scenes:
  - id: intro
    narration: >-
      This demo looks like an editor. Files and a preview on top, and a terminal
      below, all in one tmux window.

  - id: explore
    narration: >-
      Switch to the explorer and open the source folder. The preview shows the
      selected file with syntax highlighting.
    pause_ms: 600ms     # give the preview time after each key
    actions:
      - focus: explorer
      - key: Right
      - key: Right
      - key: Down

  - id: run
    narration: Back in the terminal, run the program.
    actions:
      - focus: terminal
      - run: PYTHONPATH=src python3 -m greet Ada Grace
      - wait: "Hello, Grace!"

  - id: edit
    narration: >-
      Change the greeting from the terminal. The preview picks up the change, and
      the next run uses it.
    actions:
      - run: sed -i 's/Hello/Welcome/' src/greet/__main__.py
      - run: PYTHONPATH=src python3 -m greet Ada
      - wait: "Welcome, Ada!"

  - id: tests
    narration: >-
      The test still expects the old greeting. Reveal jumps to the test file, and
      Enter opens it in the micro editor.
    actions:
      - reveal: tests/test_greet.py
      - focus: explorer
      - hold: 800ms
      - key: Enter

  - id: fix
    narration: Fix the expected text, save, and close the editor.
    actions:
      - key: Down 4
      - key: Right 36
      - key: Backspace 5
      - type_command: Welcome
      - hold: 600ms
      - ctrl_sequence: C-s
      - hold: 600ms
      - ctrl_sequence: C-q

  - id: diff
    narration: Finally, the diff shows everything this demo changed.
    actions:
      - diff
      - hold: auto        # wait for the narration, then keep the diff on screen
      - hold: 1.5s
