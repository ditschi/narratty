# yaml-language-server: $schema=https://raw.githubusercontent.com/ditschi/narratty/main/schema/v1.json
# An editor-like layout: yazi as file explorer and preview on top, a shell below.
# tmux and yazi come from the narratty toolkit, which the narratty image contains.
version: 1
meta:
  title: Editor layout with tmux and yazi
timing:
  tail_ms: 0          # the last visible frame is held in the edit scene instead
terminal:
  width: 1600
  height: 900
  font_size: 18
requires:
  tools: [tmux, yazi]
workspace:
  source: project
scenes:
  - id: layout
    hidden: true
    actions:
      # Explorer (yazi) on top, a terminal below; focus stays in the terminal.
      - run: >-
          tmux new-session -s ide yazi \;
          split-window -v -l 30% "PS1='$ ' bash --norc" \;
          select-pane -t 1 -T Explorer \; select-pane -t 2 -T Terminal
      - wait: Terminal

  - id: intro
    narration: >-
      This demo looks like an editor. Files and a preview on top, and a terminal
      below, all in one tmux window.

  - id: explore
    narration: >-
      Switch to the explorer and open the source folder. The preview shows the
      selected file with syntax highlighting.
    pause_ms: 600ms     # give the preview time after each key
    actions:
      - ctrl_sequence: C-b
      - key: Up
      - key: Right
      - key: Right
      - key: Down

  - id: run
    narration: Back in the terminal, run the program.
    actions:
      - ctrl_sequence: C-b
      - key: Down
      - run: PYTHONPATH=src python3 -m greet Ada Grace
      - wait: "Hello, Grace!"

  - id: edit
    narration: >-
      Change the greeting from the terminal. The preview picks up the change, and
      the next run uses it.
    actions:
      - run: sed -i 's/Hello/Welcome/' src/greet/__main__.py
      - run: PYTHONPATH=src python3 -m greet Ada
      - wait: "Welcome, Ada!"
      - hold: auto        # wait for the narration, then keep the result on screen
      - hold: 1500

  - id: close
    hidden: true
    actions:
      - run: tmux kill-server
