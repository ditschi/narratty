    const [from, to] = b.scroll;
    const p = Math.min(1, Math.max(0, (t - from) / Math.max(to - from, 0.001)));
    views[i].querySelector(".page").style.translate = "0 " + (-p * b.scroll_by) + "cqw";
  });
  requestAnimationFrame(browse);
}
if (browsers.length) browse();
</script>
</body>
</html>
