name: Docker image
# PRs: build and test the image (amd64, not pushed).
# main: push :edge / :edge-kokoro.  Releases (release.yml calls this with the tag):
# push :<version>, :<major.minor>, :latest (and -kokoro).
# The toolkit target is published the same way as narratty-toolkit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Release tag to build, e.g. v1.2.3
        type: string
        required: true
concurrency:
  group: docker-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  image:
    name: Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            target: base
            image: narratty
            suffix: ""
          - variant: kokoro
            target: kokoro
            image: narratty
            suffix: "-kokoro"
          - variant: toolkit
            target: toolkit
            image: narratty-toolkit
            suffix: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # the version comes from git tags
      - uses: astral-sh/setup-uv@v7
      - name: Version
        id: version
        run: echo "version=$(uvx --from setuptools-scm python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=edge,branch=main,enable=${{ !inputs.ref }}
            type=semver,pattern={{version}},value=${{ inputs.ref }},enable=${{ !!inputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }},enable=${{ !!inputs.ref }}
            type=raw,value=latest,enable=${{ !!inputs.ref }}
            type=ref,event=pr
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push outside PRs)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: NARRATTY_VERSION=${{ steps.version.outputs.version }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && format('{0}:test{1}', matrix.image, matrix.suffix) || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test (toolkit in foreign images, as a non-root user)
        if: github.event_name == 'pull_request' && matrix.variant == 'toolkit'
        run: |
          cid=$(docker create narratty-toolkit:test /bin/true)
          mkdir toolkit && docker cp "$cid":/. toolkit && docker rm "$cid"
          for image in debian:trixie-slim alpine:3.22 busybox:1.37; do
            echo "== $image"
            docker run --rm --user 4321:4321 -e HOME=/tmp \
              -v "$PWD/toolkit:/usr/local:ro" -v "$PWD/docker/toolkit/smoke.sh:/smoke.sh:ro" \
              "$image" sh /smoke.sh
          done
      - name: Smoke test
        if: github.event_name == 'pull_request' && matrix.variant != 'toolkit'
        run: |
          docker run --rm narratty:test${{ matrix.suffix }} --version
          docker run --rm narratty:test${{ matrix.suffix }} doctor --runtime native
          docker run --rm narratty:test${{ matrix.suffix }} voices --installed
          docker run --rm --entrypoint sh -v "$PWD/docker/toolkit/smoke.sh:/smoke.sh:ro" \
            narratty:test${{ matrix.suffix }} /smoke.sh
      - uses: actions/setup-python@v6
        if: github.event_name == 'pull_request' && matrix.variant == 'base'
        with:
          python-version: "3.12"
      - name: Install ffprobe (the test checks the video on the host)
        if: github.event_name == 'pull_request' && matrix.variant == 'base'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build a video through the container runtime and test the sandbox network
        if: github.event_name == 'pull_request' && matrix.variant == 'base'
        env:
          NARRATTY_IMAGE: narratty:test
        run: |
          uv tool install nox
          nox -s integration -- -k "container or sandbox_network"
