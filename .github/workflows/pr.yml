name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  # ── 0. What changed: decides which jobs run; the ci-ok gate always reports ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.ci.outputs.ci }}
      docker: ${{ steps.docker.outputs.docker }}
    steps:
      # CI runs unless every changed file is on this list.
      - uses: dorny/paths-filter@v3
        id: ci
        with:
          predicate-quantifier: every
          filters: |
            ci:
              - "**"
              - "!.gitignore"
              - "!.codespellignore"
              - "!.pre-commit-config.yaml"
              - "!AGENTS.md"
              - "!LICENSE"
              - "!.vscode/**"
              - "!.github/ISSUE_TEMPLATE/**"
              - "!.github/dependabot.yml"
      - uses: dorny/paths-filter@v3
        id: docker
        with:
          filters: |
            docker:
              - Dockerfile
              - .dockerignore
              - docker/**
              - agent/**
              - src/**
              - pyproject.toml
              - uv.lock
              - noxfile.py
              - tests/integration/**
              - .github/workflows/docker.yml
              - .github/workflows/pr.yml
  # ── 1. Conventional Commits PR-title lint (primary gate for squash merges) ──
  lint-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            Subject must start lowercase and not end with a period.
  # ── 2. Code quality ─────────────────────────────────────────────────────────
  quality:
    name: Quality gates (3.12)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs tags for the version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Syntax check
        run: nox -s check_syntax
      - name: Lint
        run: nox -s lint
      - name: Type check
        run: nox -s check_types
      - name: Import analysis
        run: nox -s necessary_imports
      - name: Dead code
        run: nox -s dead_code
      - name: Duplicate code
        run: nox -s duplicates
      - name: Cyclic imports
        run: nox -s cyclic_imports
  # ── Agent: narratty-agent (Go) ───────────────────────────────────────────────
  agent:
    name: Agent (Go)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Vet and test
        run: nox -s agent
  # ── 3. Tests: multi-Python matrix, macOS best effort ────────────────────────
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # macOS is optional: smoke-test the primary Python, never block.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Unit tests
        run: nox -s tests-${{ matrix.python-version }}
  # ── Package: the wheel builds and installs, whatever the Docker image does ──
  package:
    name: Package (wheel install)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Install the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/venv/bin/narratty" --version
          "$RUNNER_TEMP/venv/bin/narratty" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" -c "import importlib.resources as r; assert r.files('narratty.data').joinpath('voices.toml').is_file()"
  # ── 4. Integration: real voices, VHS and ffmpeg ─────────────────────────────
  integration:
    name: Integration (3.12)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      NARRATTY_DATA_DIR: ${{ github.workspace }}/.narratty-data
      VHS_VERSION: "0.12.1"
      YAZI_VERSION: "26.9.1"
      # Chromium's sandbox is blocked by Ubuntu's user-namespace restrictions on runners.
      VHS_NO_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Cache voices and models
        uses: actions/cache@v5
        with:
          path: .narratty-data
          key: narratty-voices-${{ hashFiles('src/narratty/data/voices.toml') }}
      - name: Install ffmpeg, ttyd and VHS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ttyd
          curl -fsSL -o "$RUNNER_TEMP/vhs.deb" \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/vhs.deb"
          vhs --version
      - name: Install tmux and yazi (the editor layout)
        run: |
          sudo apt-get install -y --no-install-recommends tmux git unzip
          curl -fsSL -o "$RUNNER_TEMP/yazi.zip" \
            "https://github.com/sxyazi/yazi/releases/download/v${YAZI_VERSION}/yazi-x86_64-unknown-linux-musl.zip"
          unzip -q "$RUNNER_TEMP/yazi.zip" -d "$RUNNER_TEMP/yazi"
          sudo install -m 0755 "$RUNNER_TEMP"/yazi/yazi-*/yazi "$RUNNER_TEMP"/yazi/yazi-*/ya /usr/local/bin/
          yazi --version
      - name: Install nox
        run: uv tool install nox
      - name: Integration tests
        run: nox -s integration
  # ── 5. CLI cold-start performance budgets ───────────────────────────────────
  performance:
    name: Performance budgets (3.12)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Performance budgets
        run: nox -s performance
  # ── 6. Docs build (strict) ──────────────────────────────────────────────────
  docs-build:
    name: Docs build (strict)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Build docs
        run: nox -s docs
  # ── Docs check: our docs' commands run, and print what the docs show ────────
  docs-check:
    name: Docs check (narratty check)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Check docs
        run: nox -s docs_check
  # ── Docker image: built and smoke-tested when its inputs change ─────────────
  docker:
    name: Docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write # requested by docker.yml; PR runs never push
    uses: ./.github/workflows/docker.yml
  # ── 7. Docs preview: pr-<N>/ on GitHub Pages, linked in a PR comment ────────
  # Forks get a read-only token, so only branches of this repo get a preview.
  docs-preview:
    name: Docs preview
    runs-on: ubuntu-latest
    needs: docs-build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'edited'
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: pr-${{ github.event.pull_request.number }}
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install docs deps
        run: uv pip install -e ".[docs]" --system
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy preview (hidden from the version selector)
        run: |
          # Other previews and the main deploy push to gh-pages too; retry on a race.
          for attempt in 1 2 3; do
            git fetch --force origin gh-pages:gh-pages
            if mike deploy --push --title "PR #${{ github.event.pull_request.number }}" --prop-set hidden=true "$VERSION"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Write the comment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url="https://ditschi.github.io/narratty/$VERSION/"
          pages=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'docs/*.md' \
            | sed -e 's|^docs/||' -e 's|index\.md$||' -e 's|\.md$|/|')
          {
            echo "<!-- docs-preview -->"
            echo "**Docs preview** for ${HEAD_SHA:0:7}: $url"
            if [ -n "$pages" ]; then
              echo
              echo "Changed pages:"
              for page in $pages; do echo "- [${page:-home}]($url$page)"; done
            fi
            echo
            echo "_Updated on every push; removed when the PR is closed._"
          } > "$RUNNER_TEMP/comment.md"
      - name: Post or update the comment
        uses: actions/github-script@v8
        with:
          script: |
            const body = require("fs").readFileSync(`${process.env.RUNNER_TEMP}/comment.md`, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.user.type === "Bot" && c.body.startsWith("<!-- docs-preview -->"));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
  # ── The only required status check: skipped jobs pass, failed ones do not ──
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint-title, quality, agent, tests, package, integration, performance, docs-build, docs-check, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
