name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  # ── 1. Conventional Commits PR-title lint (primary gate for squash merges) ──
  lint-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            Subject must start lowercase and not end with a period.
  # ── 2. Code quality ─────────────────────────────────────────────────────────
  quality:
    name: Quality gates (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs tags for the version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Syntax check
        run: nox -s check_syntax
      - name: Lint
        run: nox -s lint
      - name: Type check
        run: nox -s check_types
      - name: Import analysis
        run: nox -s necessary_imports
      - name: Dead code
        run: nox -s dead_code
      - name: Duplicate code
        run: nox -s duplicates
      - name: Cyclic imports
        run: nox -s cyclic_imports
  # ── Agent: narratty-agent (Go) ───────────────────────────────────────────────
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Vet and test
        run: nox -s agent
  # ── 3. Tests: multi-Python matrix, macOS best effort ────────────────────────
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # macOS is optional: smoke-test the primary Python, never block.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Unit tests
        run: nox -s tests-${{ matrix.python-version }}
  # ── 4. Integration: real voices, VHS and ffmpeg ─────────────────────────────
  integration:
    name: Integration (3.12)
    runs-on: ubuntu-latest
    env:
      NARRATTY_DATA_DIR: ${{ github.workspace }}/.narratty-data
      VHS_VERSION: "0.12.1"
      YAZI_VERSION: "26.9.1"
      # Chromium's sandbox is blocked by Ubuntu's user-namespace restrictions on runners.
      VHS_NO_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Cache voices and models
        uses: actions/cache@v5
        with:
          path: .narratty-data
          key: narratty-voices-${{ hashFiles('src/narratty/data/voices.toml') }}
      - name: Install ffmpeg, ttyd and VHS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ttyd
          curl -fsSL -o "$RUNNER_TEMP/vhs.deb" \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/vhs.deb"
          vhs --version
      - name: Install tmux and yazi (the editor layout)
        run: |
          sudo apt-get install -y --no-install-recommends tmux git unzip
          curl -fsSL -o "$RUNNER_TEMP/yazi.zip" \
            "https://github.com/sxyazi/yazi/releases/download/v${YAZI_VERSION}/yazi-x86_64-unknown-linux-musl.zip"
          unzip -q "$RUNNER_TEMP/yazi.zip" -d "$RUNNER_TEMP/yazi"
          sudo install -m 0755 "$RUNNER_TEMP"/yazi/yazi-*/yazi "$RUNNER_TEMP"/yazi/yazi-*/ya /usr/local/bin/
          yazi --version
      - name: Install nox
        run: uv tool install nox
      - name: Integration tests
        run: nox -s integration
  # ── 5. CLI cold-start performance budgets ───────────────────────────────────
  performance:
    name: Performance budgets (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Performance budgets
        run: nox -s performance
  # ── 6. Docs build (strict) ──────────────────────────────────────────────────
  docs-build:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Build docs
        run: nox -s docs
