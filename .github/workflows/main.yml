name: Main
on:
  push:
    branches: [main]
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # ── 1. Full quality gates ───────────────────────────────────────────────────
  quality:
    name: Quality gates (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Run all quality gates
        run: nox --no-error-on-missing-interpreters
  # ── Agent: narratty-agent (Go) ───────────────────────────────────────────────
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Vet and test
        run: nox -s agent
  # ── 2. Tests: multi-Python matrix, macOS best effort ────────────────────────
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Unit tests
        run: nox -s tests-${{ matrix.python-version }}
  # ── 3. Deploy docs `latest` to GitHub Pages ─────────────────────────────────
  docs-deploy:
    name: Deploy docs (latest)
    runs-on: ubuntu-latest
    needs: [quality, tests, agent]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install docs deps
        run: uv pip install -e ".[docs]" --system
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy latest docs
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          mike deploy --push --update-aliases latest
          mike set-default --push latest
