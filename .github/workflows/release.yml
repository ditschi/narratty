name: Release
# Releases when `cz bump` lands on main: the tag job finds the bump commit for the
# newest CHANGELOG version, tags it and the rest of the workflow releases that tag.
# Pushing a v* tag by hand still works.
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write # push the tag, create GitHub Release
  id-token: write # OIDC Trusted Publishing (PyPI + TestPyPI)
jobs:
  # ── 0. Find (or create) the release tag ─────────────────────────────────────
  tag:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the bump commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -nE 's/^## v([0-9]+\.[0-9]+\.[0-9]+[^ ]*) .*/\1/p' CHANGELOG.md | head -n1)
          if [[ -z "$version" ]]; then
            echo "Nothing to release (no version in CHANGELOG.md)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            # Tagged before: finish the release if an earlier run failed before the GitHub release.
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version is already released."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "v$version is tagged but not released; releasing it."
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          commit=$(git log --format=%H -1 --grep="^bump: version .* → $version\$")
          if [[ -z "$commit" ]]; then
            echo "::error::CHANGELOG has v$version but no 'bump: version … → $version' commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version" "$commit"
          git push origin "v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  # ── 1. Build sdist + wheel ───────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.release == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag.outputs.version }}
          fetch-depth: 0 # hatch-vcs needs full history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install hatch
        run: uv tool install hatch
      - name: Build
        run: hatch build
      - name: Extract version
        id: version
        run: echo "version=${{ needs.tag.outputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  # ── 1b. Container images for the tag ────────────────────────────────────────
  images:
    name: Container images
    needs: [tag, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      ref: v${{ needs.tag.outputs.version }}
    secrets: inherit
  # ── 2. Publish to TestPyPI (dry-run gate) ───────────────────────────────────
  publish-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/narratty
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true
          skip-existing: true # a re-run after a later failure
      - uses: astral-sh/setup-uv@v7
      - name: Verify install from TestPyPI
        run: |
          # The index can lag a few seconds behind the upload.
          for attempt in 1 2 3 4 5; do
            uv tool install --refresh \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              "narratty==${{ needs.build.outputs.version }}" && break
            [[ $attempt == 5 ]] && exit 1
            sleep 15
          done
          narratty --version
  # ── 3. Publish to PyPI (production) ─────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, publish-test]
    environment:
      name: pypi
      url: https://pypi.org/p/narratty
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: true # a re-run after a later failure
  # ── 4. Create GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.build.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install commitizen
        run: uv tool install commitizen
      - name: Extract changelog for this version
        run: |
          cz changelog --dry-run "${{ needs.build.outputs.version }}" > /tmp/release-notes.md || \
          echo "Release ${{ needs.build.outputs.version }}" > /tmp/release-notes.md
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }} # the run may come from a push to main
          body_path: /tmp/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
  # ── 5. Deploy versioned docs ─────────────────────────────────────────────────
  docs-deploy:
    name: Deploy versioned docs
    runs-on: ubuntu-latest
    needs: [build, github-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.build.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install docs deps
        run: uv pip install -e ".[docs]" --system
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy versioned docs
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          mike deploy --push --update-aliases "$VERSION" stable
          mike set-default --push stable
