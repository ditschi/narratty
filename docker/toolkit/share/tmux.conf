# narratty: tmux for recordings (installed as /usr/local/etc/tmux.conf). Quiet status line, visible pane borders, no delays.
set -g default-terminal "tmux-256color"
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g mouse off
set -g status off
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour75"
set -g pane-border-status top
set -g allow-set-title off
set -g pane-border-format " #{?pane_title,#{pane_title},#{pane_current_command}} "
