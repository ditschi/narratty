site_name: narratty
site_description: Turn a YAML script into a narrated terminal video with local TTS, VHS rendering and automatic voiceover sync.
site_url: https://ditschi.github.io/narratty/
repo_url: https://github.com/ditschi/narratty
repo_name: ditschi/narratty
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ditschi/narratty

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - Home: index.md
  - User Guide:
      - Installation: user-guide/installation.md
      - Shell completion: user-guide/shell-completion.md
      - Commands: user-guide/commands.md
      - Spec reference: user-guide/spec.md
      - Voices and audio cache: user-guide/voices.md
  - Design: design.md
  - Contributor Guide:
      - Development setup: contributor-guide/dev-setup.md
      - Release process: contributor-guide/release-process.md
  - API Reference: api-reference.md
  - Changelog: changelog.md
