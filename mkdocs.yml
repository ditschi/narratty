site_name: narratty
site_description: Turn your docs into narrated terminal videos with local TTS, commands that really run and automatic voiceover sync.
site_url: https://ditschi.github.io/narratty/
repo_url: https://github.com/ditschi/narratty
repo_name: ditschi/narratty
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ditschi/narratty

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - Home: index.md
  - User Guide:
      - Getting started:
          - Installation: user-guide/installation.md
          - Shell completion: user-guide/shell-completion.md
      - From docs to video:
          - Markdown input: user-guide/markdown.md
          - Building a video: user-guide/building.md
          - Docs for reading and listening: user-guide/dual-use.md
          - Voices and audio cache: user-guide/voices.md
      - YAML scenes:
          - Writing specs: user-guide/writing-specs.md
          - Spec reference: user-guide/spec.md
      - Where commands run:
          - Sandboxed runs: user-guide/container.md
          - Project environments: user-guide/environments.md
          - Demo toolkit: user-guide/toolkit.md
      - Reference:
          - Commands: user-guide/commands.md
          - Configuration: user-guide/configuration.md
  - Examples:
      - examples/index.md
      - Voices and engines: examples/voices.md
      - Pronunciation: examples/pronunciation.md
      - Terminal look: examples/terminal.md
      - Editor layout: examples/editor-layout.md
      - Subtitles and drafts: examples/subtitles.md
      - Asciicast player: examples/cast.md
      - Web pages: examples/browser.md
      - End card: examples/end-card.md
  - Contributor Guide:
      - Development setup: contributor-guide/dev-setup.md
      - Release process: contributor-guide/release-process.md
      - Design notes: contributor-guide/design.md
      - Dual-use study: contributor-guide/dual-use-study.md
  - Changelog: changelog.md
